<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP Go Identity Service - Test Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
        }

        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 480px;
            margin: 1rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #21262d;
            padding-bottom: 1rem;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 0.875rem;
            color: #8b949e;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #6e7681;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .checkbox-group input {
            margin-right: 0.5rem;
            accent-color: #58a6ff;
        }

        .checkbox-group label {
            font-size: 0.875rem;
            color: #c9d1d9;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 1rem;
        }

        .btn:hover {
            background-color: #2ea043;
        }

        .btn:active {
            background-color: #1a7f37;
        }

        .btn:disabled {
            background-color: #21262d;
            color: #6e7681;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .btn-secondary:hover {
            background-color: #30363d;
        }

        .result-container {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            display: none;
        }

        .result-container.success {
            border-color: #238636;
            background-color: rgba(35, 134, 54, 0.1);
        }

        .result-container.error {
            border-color: #da3633;
            background-color: rgba(218, 54, 51, 0.1);
        }

        .result-header {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
        }

        .result-header.success {
            color: #56d364;
        }

        .result-header.error {
            color: #f85149;
        }

        .result-content {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.75rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #c9d1d9;
            background-color: #161b22;
            padding: 0.75rem;
            border-radius: 4px;
            border: 1px solid #30363d;
            max-height: 300px;
            overflow-y: auto;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            font-size: 0.75rem;
            color: #8b949e;
            border-top: 1px solid #21262d;
            margin-top: 1rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-dot.online {
            background-color: #56d364;
        }

        .status-dot.offline {
            background-color: #f85149;
        }

        .status-dot.checking {
            background-color: #e3b341;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid #30363d;
            border-top: 2px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SCP Go Identity Service</h1>
            <p>Test de Autenticación</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="usuario@empresa.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Ingresa tu contraseña"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="generateToken" name="generateToken" checked>
                <label for="generateToken">Generar token JWT</label>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                Autenticar
            </button>

            <button type="button" class="btn btn-secondary" id="checkHealthBtn">
                Verificar Servicio
            </button>
        </form>

        <div id="resultContainer" class="result-container">
            <div id="resultHeader" class="result-header">
                <span id="resultIcon"></span>
                <span id="resultTitle"></span>
            </div>
            <div id="resultContent" class="result-content"></div>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <div id="statusDot" class="status-dot checking"></div>
                <span id="statusText">Verificando...</span>
            </div>
            <div id="serviceUrl">localhost:8081</div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081';
        
        // Elements
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const generateTokenInput = document.getElementById('generateToken');
        const loginBtn = document.getElementById('loginBtn');
        const checkHealthBtn = document.getElementById('checkHealthBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultHeader = document.getElementById('resultHeader');
        const resultTitle = document.getElementById('resultTitle');
        const resultIcon = document.getElementById('resultIcon');
        const resultContent = document.getElementById('resultContent');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // State
        let isLoading = false;

        // Initialize
        checkServiceHealth();

        // Event listeners
        form.addEventListener('submit', handleLogin);
        checkHealthBtn.addEventListener('click', checkServiceHealth);

        async function handleLogin(e) {
            e.preventDefault();
            
            if (isLoading) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const generateToken = generateTokenInput.checked;

            if (!email || !password) {
                showResult('error', 'Error de Validación', 'Email y contraseña son requeridos');
                return;
            }

            setLoading(true);
            showResult('info', 'Autenticando...', 'Enviando credenciales al servicio...');

            try {
                const response = await fetch(`${API_BASE}/authenticate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        generateToken: generateToken
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showResult('success', 'Autenticación Exitosa', formatSuccessResponse(data));
                } else {
                    showResult('error', 'Error de Autenticación', data.message || 'Credenciales inválidas');
                }
            } catch (error) {
                showResult('error', 'Error de Conexión', `No se pudo conectar al servicio:\n${error.message}`);
            } finally {
                setLoading(false);
            }
        }

        async function checkServiceHealth() {
            statusDot.className = 'status-dot checking';
            statusText.textContent = 'Verificando...';

            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();

                if (response.ok) {
                    statusDot.className = 'status-dot online';
                    statusText.textContent = 'Servicio disponible';
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                statusDot.className = 'status-dot offline';
                statusText.textContent = 'Servicio no disponible';
            }
        }

        function setLoading(loading) {
            isLoading = loading;
            loginBtn.disabled = loading;
            checkHealthBtn.disabled = loading;
            
            if (loading) {
                loginBtn.innerHTML = '<div class="loading"></div>Autenticando...';
            } else {
                loginBtn.innerHTML = 'Autenticar';
            }
        }

        function showResult(type, title, content) {
            resultContainer.className = `result-container ${type}`;
            resultContainer.style.display = 'block';
            
            resultHeader.className = `result-header ${type}`;
            resultTitle.textContent = title;
            
            // Icons
            const icons = {
                success: '✓',
                error: '✗',
                info: 'ⓘ'
            };
            resultIcon.textContent = icons[type] || '';
            
            resultContent.textContent = content;
            
            // Scroll to result
            resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function formatSuccessResponse(data) {
            let formatted = `Usuario: ${data.user?.email || 'N/A'}\n`;
            formatted += `ID: ${data.user?.id || 'N/A'}\n`;
            formatted += `Nombre: ${data.user?.firstName || ''} ${data.user?.lastName || ''}\n`;
            
            if (data.roles && data.roles.length > 0) {
                formatted += `\nRoles: ${data.roles.join(', ')}\n`;
            }
            
            if (data.claims && data.claims.length > 0) {
                formatted += `\nClaims:\n`;
                data.claims.forEach(claim => {
                    formatted += `  ${claim.type}: ${claim.value}\n`;
                });
            }
            
            if (data.token) {
                formatted += `\nToken JWT:\n${data.token.substring(0, 100)}...\n`;
                formatted += `Expira: ${data.expiresAt || 'N/A'}`;
            }
            
            return formatted;
        }

        // Auto-check health every 30 seconds
        setInterval(checkServiceHealth, 30000);
    </script>
</body>
</html>
